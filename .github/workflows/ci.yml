name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  package:
    name: Package
    needs: checks
    uses: ./.github/workflows/package.yml
    with:
      version: 0.0.0-ci.${{ github.run_number }}
