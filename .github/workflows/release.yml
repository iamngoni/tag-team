name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Resolve and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/tagteam-hub/Cargo.toml | head -n 1)"
          runner_version="$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)".*/\1/p' runner/package.json | head -n 1)"
          plugin_version="$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)".*/\1/p' plugin/.claude-plugin/plugin.json | head -n 1)"
          [[ -n "$source_version" && "$runner_version" == "$source_version" && "$plugin_version" == "$source_version" ]] || {
            echo "version mismatch: hub=$source_version runner=$runner_version plugin=$plugin_version" >&2
            exit 1
          }
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "release tag must start with v" >&2; exit 1; }
            [[ "$version" == "$source_version" ]] || {
              echo "tag version $version does not match crate version $source_version" >&2
              exit 1
            }
          else
            version="$source_version"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid semantic version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  package:
    name: Package
    needs:
      - prepare
      - checks
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - prepare
      - package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: tagteam-*
          path: dist
          merge-multiple: true

      - name: Verify archive checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          [[ ${#archives[@]} -gt 0 ]] || { echo "no archives downloaded" >&2; exit 1; }
          for archive in "${archives[@]}"; do
            (cd dist && sha256sum -c "$(basename "$archive").sha256")
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.sha256 \
              --verify-tag \
              --title "Tag Team $TAG" \
              --generate-notes
          fi
