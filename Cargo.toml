[workspace]
resolver = "3"
members = [
  "crates/tagteam-core",
  "crates/tagteam-proto",
  "crates/tagteam-pki",
  "crates/tagteam-git",
  "crates/tagteam-sandbox",
  "crates/tagteam-proxy",
  "crates/tagteam-hub",
  "crates/tagteam-node",
  "tests/integration",
]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "UNLICENSED"
repository = "https://github.com/iamngoni/tag-team"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
data-encoding = "2.9.0"
sysinfo = "0.38.4"
nix = { version = "0.31.3", features = ["fs", "process", "resource", "sched", "signal", "user"] }
x509-parser = "0.18.1"
httparse = "1.10.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
prost = "0.14.4"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.41.0", features = ["bundled", "serde_json"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.20", features = ["codec"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
toml = "1.1.8"
tonic = { version = "0.14.7", features = ["transport", "codegen", "tls-ring"] }
tonic-prost = "0.14.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ulid = { version = "3.0.0", features = ["serde"] }

[workspace.dependencies.rcgen]
version = "0.14.10"
features = ["x509-parser"]

[workspace.dependencies.rustls]
version = "0.23.37"
default-features = false
features = ["ring", "std", "tls12"]

[workspace.dependencies.tonic-prost-build]
version = "0.14.7"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
